const api = httpsCallable(functions, 'action');
const app = document.querySelector('#app');
const notice = document.querySelector('#notice');
const games = {
  trivia: ['أسرع جواب', '؟', 'mint', 'أسئلة ثقافة عامة بخيارات متعددة.', 2],
  photos: ['خمن الصورة', '◉', 'peach', 'صور حقيقية لمعالم وحيوانات. خمن ما تراه.', 2],
  secret: ['برا السالفة', '◈', 'blue', 'كلمة واحدة، ولاعب واحد ما يعرفها. أعطوا تلميحات وصوّتوا.', 3],
  mafia: ['المافيا', '☾', 'rose', 'دور سري في الليل وتصويت جماعي في النهار.', 4]
};
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const control = (label, command, extra = '', style = '') => '<button type="button" class="' + style + '" data-command="' + command + '" ' + extra + '>' + label + '</button>';
const gameSelect = () => '<label>اللعبة<select name="game">' + Object.entries(games).map(([id, game]) => '<option value="' + id + '">' + game[0] + '</option>').join('') + '</select></label>';
const panel = html => '<div class="panel">' + html + '</div>';
const heading = (title, description = '') => '<h1>' + title + '</h1>' + (description ? '<p class="muted">' + description + '</p>' : '');
const form = (command, fields, label) => '<form data-command="' + command + '"><div class="fields">' + fields + '</div><button class="primary">' + label + '</button></form>';
const input = (label, name, attr = '') => '<label>' + label + '<input name="' + name + '" ' + attr + '></label>';

const go = fragment => { location.hash = fragment; };
const route = () => (location.hash.slice(1) || 'home').split('/');
const announce = message => { notice.textContent = message; };
const call = async (command, fields = {}) => (await api({ command, ...fields })).data;

let user = null;
let profile = null;
let profileReady = false;
let snapshotReady = false;
let room = null;
let role = null;
let list = [];
let viewStops = [];
let stopProfile = () => {};
let busy = false;

function activeRoute() {
  return route()[0];
}

function renderHome() {
  const cards = Object.entries(games).map(([id, [name, glyph, color, description, count]]) =>
    '<article class="card ' + color + '"><div class="card-art" aria-hidden="true">' + glyph + '</div><span class="category">من ' + count + ' لاعبين</span><h3>' + name + '</h3><p>' + description + '</p><a class="primary" href="#game/' + id + '">خيارات اللعب</a></article>').join('');
  return '<div class="hero"><div><h1>خلّها <em>لَمّة.</em></h1><p>تحدّوا أصحابكم في غرفة خاصة، أو ادخلوا اللعب العام وتعرّفوا على منافسين جدد.</p><a class="primary" href="#games">اختر لعبة</a> <a class="secondary" href="#join">انضم بكود</a></div><div class="hero-art" aria-hidden="true"><span class="mint">؟</span><span class="peach">◉</span><span class="blue">◈</span><span class="rose">☾</span></div></div><section id="games"><div class="section-head"><h2>الألعاب</h2><a href="#rank">ترتيب اللاعبين</a></div><div class="grid">' + cards + '</div></section>';
}

function requireProfile() {
  if (user && !profileReady) return panel('جارٍ تحميل الحساب…');
  return panel('<p>تحتاج حسابًا واسم لاعب للمتابعة.</p><a class="primary" href="#account">افتح حسابك</a>');
}

function renderAccount() {
  if (!user) {
    const email = input('البريد الإلكتروني', 'email', 'type="email" autocomplete="email" required');
    const signin = email + input('كلمة المرور', 'password', 'type="password" autocomplete="current-password" required');
    const signup = email + input('كلمة المرور', 'password', 'type="password" minlength="6" autocomplete="new-password" required');
    return heading('حسابك') + '<div class="split">' + panel('<h2>تسجيل الدخول</h2>' + form('login', signin, 'دخول')) + panel('<h2>حساب جديد</h2>' + form('register', signup, 'إنشاء حساب')) + '</div>';
  }
  if (!profileReady) return panel('جارٍ تحميل الحساب…');
  return heading('حسابك') + panel(form('profile', input('اسم اللاعب الظاهر للآخرين', 'name', 'minlength="2" maxlength="28" required value="' + esc(profile?.name) + '"'), 'حفظ الاسم') +
    (profile ? '<p class="account-code">معرّف الإضافة <code dir="ltr">' + esc(user.uid) + '</code></p><p>النقاط: ' + profile.points + '</p>' : '') +
    control('تسجيل الخروج', 'logout'));
}

function renderGroups() {
  const groupList = list.map(([id, group]) => '<article class="panel"><h2>' + esc(group.title) + '</h2><p>كود المجموعة <code dir="ltr">' + id + '</code> · ' + group.memberIds.length + ' أعضاء</p>' +
    (group.activeRoom ? control('انضم لغرفة المجموعة', 'joinRoom', 'data-code="' + group.activeRoom + '"', 'primary') : '') +
    (group.owner === user.uid ? form('createRoom', '<input type="hidden" name="group" value="' + id + '">' + gameSelect(), 'افتح غرفة للمجموعة') : '') + '</article>').join('');
  return heading('مجموعاتك', 'شارك كود المجموعة مع أصدقائك. صاحب المجموعة يختار اللعبة ويفتح الغرفة.') +
    '<div class="split">' + panel(form('createGroup', input('اسم المجموعة', 'title', 'maxlength="40" required'), 'أنشئ مجموعة')) +
    panel(form('joinGroup', input('كود المجموعة', 'code', 'dir="ltr" maxlength="10" required'), 'انضم للمجموعة')) + '</div>' + groupList;
}

function renderFriends() {
  const friends = list.map(([id, friend]) => '<li><span><strong>' + esc(friend.alias || friend.name) + '</strong>' + (friend.alias ? ' · ' + esc(friend.name) : '') + '</span>' +
    control('تعديل الاسم', 'editFriend', 'data-friend="' + esc(id) + '"') + control('إزالة', 'unfriend', 'data-friend="' + esc(id) + '"') + '</li>').join('');
  return heading('الأصدقاء', 'أضف اللاعب بمعرّفه. الاسم المستعار يظهر لك وحدك.') +
    panel('<p>معرّفك <code dir="ltr">' + esc(user.uid) + '</code></p>' +
      form('friend', input('معرّف اللاعب', 'friend', 'dir="ltr" required') + input('الاسم المستعار', 'alias', 'maxlength="28"'), 'حفظ الصديق')) +
    (friends ? panel('<ul class="people">' + friends + '</ul>') : panel('لا يوجد أصدقاء في قائمتك بعد.'));
}

function renderRoom(code) {
  if (!room) return panel('جارٍ تحميل الغرفة…');
  const game = games[room.game];
  const ids = Object.keys(room.members);
  const head = heading(game[0]) + '<p class="muted">' + (room.mode === 'public' ? 'لعب عام' : 'كود الغرفة <code dir="ltr">' + code + '</code>') + ' · ' + ids.length + ' لاعبين</p>';
  const roster = '<ul class="people">' + ids.map(id => '<li>' + esc(room.members[id]) + (id === user.uid ? ' (أنت)' : '') + '</li>').join('') + '</ul>';
  const host = room.host === user.uid && room.mode !== 'public';
  if (room.phase === 'lobby') {
    return head + panel('<h2>انتظار اللاعبين</h2><p>تبدأ اللعبة بوجود ' + game[4] + ' لاعبين على الأقل.</p>' + roster +
      (host ? control('ابدأ الجولة', 'start', 'data-code="' + code + '"' + (ids.length < game[4] ? ' disabled' : ''), 'primary') : '') +
      (room.mode === 'public' ? control('إلغاء البحث', 'cancelMatch', 'data-code="' + code + '" data-game="' + room.game + '"') : ''));
  }
  if (room.phase === 'result') {
    return head + panel('<h2>نتيجة الجولة</h2><p class="answer">' + esc(room.answer) + '</p><p>' +
      (room.winners.length ? 'الفائزون: ' + room.winners.map(id => esc(room.members[id])).join('، ') : 'لم يفز أحد في هذه الجولة.') + '</p>' +
      (host ? control('جولة جديدة', 'start', 'data-code="' + code + '"', 'primary') : '') +
      (room.mode === 'public' ? control('ابحث عن مباراة جديدة', 'match', 'data-game="' + room.game + '"', 'primary') : ''));
  }
  const attrs = 'data-code="' + code + '" data-turn="' + room.turn + '" data-phase="' + room.phase + '"';
  const roleCard = role?.turn === room.turn ? '<p class="answer">دورك: ' + esc(role.role) + (role.word ? ' · كلمتك: ' + esc(role.word) : '') + '</p>' : '';
  const waitingRole = room.phase === 'night' && role?.role !== 'مافيا';
  const submitted = room.submitted.includes(user.uid);
  const eliminated = room.eliminated === user.uid;
  const choices = room.options.length ? room.options.map((option, index) => [index, option]) :
    ids.filter(id => id !== user.uid && id !== room.eliminated).map(id => [id, room.members[id]]);
  let options = '<div class="slots">' + choices.map(([id, option]) =>
    control(esc(option), 'move', attrs + ' data-value="' + esc(id) + '"' + (room.options.length ? ' data-numeric="true"' : ''))).join('') + '</div>';
  if (waitingRole || submitted || eliminated) options = '<p>' + (eliminated ? 'خرجت من الجولة. انتظر النتيجة.' : waitingRole ? 'انتظر انتهاء الليل.' : 'تم تسجيل اختيارك. انتظر بقية اللاعبين.') + '</p>';
  return head + panel('<p class="muted">الوقت المتبقي <strong id="clock"></strong></p>' + roleCard + '<h2 class="prompt">' + esc(room.prompt) + '</h2>' +
    (room.eliminated ? '<p>خرج من الجولة: ' + esc(room.members[room.eliminated]) + '</p>' : '') +
    (room.image ? '<img class="quiz-photo" src="' + esc(inlinePhotos[room.image] || room.image) + '" alt="الصورة المطلوب تخمينها">' : '') +
    (room.game === 'secret' ? '<p class="muted">تبادلوا التلميحات صوتيًا أو وجهًا لوجه، ثم اختاروا اللاعب المشتبه به.</p>' : '') +
    options + '<button type="button" id="expire" data-command="expire" ' + attrs + ' hidden>إنهاء المرحلة بعد انقضاء الوقت</button>');
}

function render() {
  const [page, id] = route();
  document.querySelector('#account').textContent = profile?.name || 'الحساب';
  app.classList.toggle('wide', page === 'home' || page === 'games');
  if (page === 'home' || page === 'games') {
    app.innerHTML = renderHome();
    if (page === 'games') document.querySelector('#games').scrollIntoView();
    return;
  }
  if (page === 'account') { app.innerHTML = renderAccount(); return; }
  if (page === 'game' && Object.hasOwn(games, id)) {
    const [name, glyph, color, description] = games[id];
    app.innerHTML = '<div class="game-banner ' + color + '"><span aria-hidden="true">' + glyph + '</span>' + heading(name, description) + '</div>' +
      (!profile ? requireProfile() : '<div class="split">' + panel('<h2>لعب عام</h2><p>نبحث عن لاعبين اختاروا نفس اللعبة.</p>' + control('ابحث عن لاعبين', 'match', 'data-game="' + id + '"', 'primary')) +
      panel('<h2>غرفة خاصة</h2><p>شارك كود الغرفة مع أصحابك.</p>' + control('افتح غرفة', 'createRoom', 'data-game="' + id + '"', 'primary')) + '</div>');
    return;
  }
  if (!profile) { app.innerHTML = requireProfile(); return; }
  const pages = {
    join: () => heading('انضم لغرفة') + panel(form('joinRoom', input('كود الغرفة', 'code', 'dir="ltr" maxlength="10" required'), 'انضم')),
    friends: renderFriends,
    groups: renderGroups,
    rank: () => heading('ترتيب اللاعبين', 'كل فوز في اللعب العام يضيف عشر نقاط.') + panel('<ol class="people">' +
      list.map(([, item]) => '<li><span>' + esc(item.name) + '</span><strong>' + item.points + ' نقطة</strong></li>').join('') + '</ol>'),
    room: () => snapshotReady && !room ? panel('الغرفة غير متاحة.') : renderRoom(id)
  };
  app.innerHTML = Object.hasOwn(pages, page) ? pages[page]() : panel('الصفحة غير موجودة.');
  updateClock();
}

function report(error) {
  const code = error.code || '';
  const messages = {
    'auth/invalid-credential': 'البريد الإلكتروني أو كلمة المرور غير صحيحة.',
    'auth/email-already-in-use': 'هذا البريد مسجّل بالفعل.',
    'auth/weak-password': 'اختر كلمة مرور أطول.',
    'auth/network-request-failed': 'تعذّر الاتصال بخدمة الحسابات.',
    'functions/internal': 'تعذّر تنفيذ الطلب. تحقق من تشغيل Firebase ثم حاول مجددًا.',
    'functions/unavailable': 'خدمة اللعب غير متاحة الآن.',
    'permission-denied': 'الحساب الحالي لا يستطيع الوصول إلى هذه الصفحة.'
  };
  announce(messages[code] || (code.startsWith('functions/') && error.message ? error.message : 'تعذّر تنفيذ الطلب. تحقق من الاتصال وحاول مجددًا.'));
}

function watchView() {
  viewStops.forEach(stop => stop());
  viewStops = [];
  list = [];
  room = role = null;
  snapshotReady = false;
  const [page, id] = route();
  if (user && profile) {
    let source;
    if (page === 'friends') source = collection(db, 'users', user.uid, 'friends');
    if (page === 'groups') source = query(collection(db, 'groups'), where('memberIds', 'array-contains', user.uid));
    if (page === 'rank') source = query(collection(db, 'players'), orderBy('points', 'desc'), limit(25));
    if (source) viewStops.push(onSnapshot(source, snap => {
      list = snap.docs.map(item => [item.id, item.data()]);
      render();
    }, report));
    if (page === 'room' && /^[0-9A-F]{10}$/.test(id)) {
      viewStops.push(onSnapshot(doc(db, 'rooms', id), snap => {
        snapshotReady = true;
        room = snap.data();
        render();
      }, error => { snapshotReady = true; render(); report(error); }));
      viewStops.push(onSnapshot(doc(db, 'rooms', id, 'roles', user.uid), snap => {
        role = snap.data();
        render();
      }, report));
    } else if (page === 'room') snapshotReady = true;
  }
  render();
}

function updateClock() {
  const clock = document.querySelector('#clock');
  if (!clock || !room) return;
  const seconds = Math.max(0, Math.ceil((room.deadline - Date.now()) / 1000));
  clock.textContent = seconds + ' ثانية';
  document.querySelector('#expire').hidden = seconds > 0;
}

window.addEventListener('hashchange', () => { announce(''); watchView(); });
setInterval(updateClock, 1000);
onAuthStateChanged(auth, current => {
  stopProfile();
  user = current;
  profile = null;
  profileReady = !user;
  watchView();
  if (user) stopProfile = onSnapshot(doc(db, 'players', user.uid), snap => {
    const changed = Boolean(profile) !== snap.exists();
    profileReady = true;
    profile = snap.data() || null;
    if (changed) watchView();
    else if (activeRoute() !== 'room') render();
  }, report);
});

async function run(command, data) {
  if (busy) return;
  busy = true;
  announce('');
  try {
    if (command === 'login') await signInWithEmailAndPassword(auth, data.email, data.password);
    else if (command === 'register') await createUserWithEmailAndPassword(auth, data.email, data.password);
    else if (command === 'logout') { await signOut(auth); go('home'); }
    else if (command === 'editFriend') {
      const editor = app.querySelector('form[data-command="friend"]');
      editor.elements.friend.value = data.friend;
      editor.elements.alias.value = list.find(([id]) => id === data.friend)?.[1].alias || '';
      editor.elements.alias.focus();
    } else {
      const result = await call(command, data);
      if (['match', 'joinRoom', 'createRoom'].includes(command)) go('room/' + result.code);
      if (command === 'cancelMatch') go('home');
      if (command === 'profile') announce('تم حفظ اسم اللاعب.');
      if (command === 'friend') announce('تم تحديث قائمة أصدقائك.');
    }
  } catch (error) { report(error); }
  finally { busy = false; }
}

app.addEventListener('submit', event => {
  event.preventDefault();
  const form = event.target;
  run(form.dataset.command, Object.fromEntries(new FormData(form)));
});
app.addEventListener('click', event => {
  const button = event.target.closest('button[data-command]');
  if (!button) return;
  const { command, numeric, ...data } = button.dataset;
  if (data.turn) data.turn = Number(data.turn);
  if (numeric) data.value = Number(data.value);
  run(command, data);
});


</script>
</head>
<body>
<header><div class="wrap nav">
<a class="brand" href="#home"><span class="mark" aria-hidden="true">✦</span> لَمّة</a>
<nav aria-label="التنقل الرئيسي"><a href="#home">العب</a><a href="#friends">الأصدقاء</a><a href="#groups">المجموعات</a><a href="#rank">الترتيب</a></nav>
<a id="account" class="secondary" href="#account">الحساب</a>
</div></header>
<div id="notice" class="wrap" role="status"></div>
<main id="app" class="wrap"><p class="panel">جارٍ تحميل المنصة…</p></main>
<footer class="wrap"><a class="brand" href="#home">لَمّة</a><span>ألعاب للجلسات والتجمّعات</span><a href="https://commons.wikimedia.org/wiki/File:EiffelTower_-_Paris.jpg">صورة البرج · Sam valadi Seguir · CC BY 2.0</a><a href="https://commons.wikimedia.org/wiki/File:Giraffe_Portrait.jpg">صورة الزرافة · Eric Kilby · CC BY-SA 2.0</a></footer>
